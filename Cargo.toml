[package]
name = "tmux-agentic"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "One overview of the coding agents running in your tmux panes"
license = "MIT"
repository = "https://github.com/oluevaera/tmux-agentic"

[[bin]]
name = "agentic"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
regex-lite = "0.1"
serde_json = "1"
toml = { version = "1.2.0", default-features = false, features = ["parse"] }
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = true
